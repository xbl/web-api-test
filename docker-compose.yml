services:
  mysql:
    image: mysql:8.0
    platform: linux/arm64/v8
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: example
    volumes:
      - './volumes/mysql:/var/lib/mysql'
      - './scripts:/docker-entrypoint-initdb.d/'